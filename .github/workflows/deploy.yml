name: deploy.yml

on:
  # This will run the workflow on pushes to main and version tags.
  # Adjust to match your branching and tagging strategy.
  push:
    branches:
      - master
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

jobs:

  deploy-docker:
    if: >-
      ${{
        success() &&
        (contains(github.ref, 'refs/tags') ||
         github.ref == 'refs/heads/master' ||
         github.ref == 'refs/heads/main')
      }}
    runs-on: ubuntu-latest
    env:
      # enabled provenance attestation during build/push (see Makefile for details)
      DOCKER_PROV: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
          persist-credentials: false
      - name: Get Tag Version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/master" ]]; then
            echo "::set-output name=TAG_VERSION::latest"
          else
            echo "::set-output name=TAG_VERSION::${GITHUB_REF##*/}"
          fi
      - name: Login to DockerHub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build Docker
        run: |
          make APP_VERSION=${{ steps.version.outputs.TAG_VERSION }} docker-info docker-build
      - name: Push to DockerHub
        run: |
          make APP_VERSION=${{ steps.version.outputs.TAG_VERSION }} docker-push
